server.port=8080
server.servlet.context-path=/api

# ---- dev database: file-backed H2 under backend/data ------------------------
spring.datasource.url=jdbc:h2:file:./data/enrollx;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/api/h2-console (JDBC URL as above).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LocalDate -> "2025-07-18", Instant -> "2025-07-18T00:00:00.000Z"
spring.jackson.serialization.write-dates-as-timestamps=false

# Let the advice answer for unmapped paths instead of the default error page.
# add-mappings stays true so Swagger UI can serve its own static files; a miss
# still reaches GlobalExceptionHandler as NoResourceFoundException.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# ---- Swagger / OpenAPI -------------------------------------------------------
# Browse the API at http://localhost:8080/api/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
