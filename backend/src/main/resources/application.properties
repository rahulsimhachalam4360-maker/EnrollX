server.port=8080
server.servlet.context-path=/api

# ---- dev database: file-backed H2 under backend/data ------------------------
spring.datasource.url=jdbc:h2:file:./data/enrollx;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/api/h2-console (JDBC URL as above).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# LocalDate -> "2025-07-18", Instant -> "2025-07-18T00:00:00.000Z"
spring.jackson.serialization.write-dates-as-timestamps=false

# Let the advice answer for unmapped paths instead of the default error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
