# Production profile: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Create the schema first:  CREATE DATABASE enrollx CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/enrollx?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
