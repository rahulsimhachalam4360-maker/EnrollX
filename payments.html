<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments &middot; Fee Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <div data-app-nav></div>

  <main class="container py-4">

    <header class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-4">
      <div>
        <h1 class="page-title">Payments</h1>
        <p class="page-subtitle">Every receipt issued, newest first</p>
      </div>
      <a href="collect.html" class="btn btn-primary btn-sm">Collect a fee</a>
    </header>

    <!-- Filters -->
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <label class="form-label small" for="filterSearch">Search</label>
            <input type="search" class="form-control" id="filterSearch"
                   placeholder="Receipt no., student or reference">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small" for="filterMode">Mode</label>
            <select class="form-select" id="filterMode">
              <option value="">All modes</option>
              <option value="Cash">Cash</option>
              <option value="UPI">UPI</option>
              <option value="Card">Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Cheque">Cheque</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small" for="filterFrom">From</label>
            <input type="date" class="form-control" id="filterFrom">
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label small" for="filterTo">To</label>
            <input type="date" class="form-control" id="filterTo">
          </div>
          <div class="col-6 col-md-2 d-grid">
            <button class="btn btn-outline-secondary" type="button" data-clear-filters>
              Clear
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Totals for the current filter -->
    <div class="row g-3 mb-3">
      <div class="col-6 col-md-4">
        <div class="stat-tile">
          <p class="stat-tile__label">Receipts shown</p>
          <p class="stat-tile__value" data-stat="count">&ndash;</p>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="stat-tile">
          <p class="stat-tile__label">Amount collected</p>
          <p class="stat-tile__value" data-stat="total">&ndash;</p>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="stat-tile">
          <p class="stat-tile__label">Average receipt</p>
          <p class="stat-tile__value" data-stat="average">&ndash;</p>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th scope="col">Receipt</th>
              <th scope="col">Date</th>
              <th scope="col">Student</th>
              <th scope="col">Mode</th>
              <th scope="col">Reference</th>
              <th scope="col" class="text-end">Amount</th>
              <th scope="col" class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody data-payment-rows>
            <tr><td colspan="7" class="table-empty">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Receipt -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header no-print">
          <h5 class="modal-title">Receipt</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="receiptPrintArea" data-receipt-body></div>
        </div>
        <div class="modal-footer no-print">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" data-print-receipt>Print receipt</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/receipt.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
